<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<style>
  :root{ --yellow:#ffe600; --yellow2:#ffd000; --ink:#1a1a1a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Marker Felt","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  body{
    background-color:var(--yellow);
    background-image:radial-gradient(var(--yellow2) 22%, transparent 24%);
    background-size:26px 26px;
    animation:dots 3s linear infinite;
  }
  @keyframes dots{to{background-position:26px 26px}}

  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

  /* sunburst rays */
  .rays{position:fixed;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.45) 0 7deg,transparent 7deg 18deg);
    animation:spin 60s linear infinite;z-index:0;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* balloons */
  .balloon{position:fixed;bottom:-140px;width:56px;height:70px;border-radius:50% 50% 48% 48%;border:3px solid var(--ink);
    z-index:1;animation:rise linear infinite;box-shadow:inset 8px 8px 0 rgba(255,255,255,.4)}
  .balloon::after{content:"";position:absolute;left:50%;bottom:-36px;width:3px;height:36px;background:var(--ink)}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(-5deg)}
    25%{transform:translateY(-30vh) translateX(18px) rotate(5deg)}
    50%{transform:translateY(-62vh) translateX(-18px) rotate(-5deg)}
    75%{transform:translateY(-95vh) translateX(18px) rotate(5deg)}
    100%{transform:translateY(-130vh) translateX(0) rotate(-5deg)}
  }

  .float{position:fixed;font-size:28px;z-index:1;animation:drift ease-in-out infinite;user-select:none;pointer-events:none}
  @keyframes drift{
    0%,100%{transform:translate(0,0) rotate(-12deg) scale(1)}
    50%{transform:translate(14px,-26px) rotate(14deg) scale(1.25)}
  }

  .stage{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:10px;text-align:center}

  /* title */
  h1.hb{font-size:clamp(32px,7.5vw,78px);line-height:1.05;font-weight:900;letter-spacing:1px}
  h1.hb span{display:inline-block;animation:bounce 1.4s ease-in-out infinite;
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--ink)}
  h1.hb .sp{width:.35em}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}

  /* trio: video - photo - video */
  .trio{display:grid;grid-template-columns:auto auto auto;grid-template-areas:"v1 photo v2";align-items:center;justify-content:center;gap:clamp(18px,4vw,60px)}
  .v1{grid-area:v1}.v2{grid-area:v2}.pw{grid-area:photo}

  .vid{position:relative;width:min(24vw,250px);aspect-ratio:3/4;border:6px solid var(--ink);border-radius:20px;overflow:hidden;
    background:#000;box-shadow:8px 8px 0 var(--ink);pointer-events:none}
  .vid video{width:100%;height:100%;object-fit:cover;display:block}
  .v1{transform:rotate(-5deg);animation:wag1 2.6s ease-in-out infinite}
  .v2{transform:rotate(5deg);animation:wag2 2.6s ease-in-out infinite}
  @keyframes wag1{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
  @keyframes wag2{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}
  .snd{position:absolute;right:6px;bottom:6px;background:#fff;border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none}

  .pw{position:relative;width:min(34vw,300px);height:min(34vw,300px);animation:wobble 3.5s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.05)}}
  .ring{position:absolute;inset:-16px;border-radius:50%;border:6px dashed var(--ink);animation:spin 14s linear infinite}
  .photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:7px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#fff}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .hat{position:absolute;top:-54px;left:50%;font-size:64px;transform:translateX(-50%) rotate(14deg);animation:hatwig 1.6s ease-in-out infinite}
  @keyframes hatwig{0%,100%{transform:translateX(-50%) rotate(8deg)}50%{transform:translateX(-50%) rotate(22deg)}}
  .orbit{position:absolute;inset:-52px;animation:spin 8s linear infinite}
  .orbit b{position:absolute;font-size:30px;font-weight:400}
  .orbit b:nth-child(1){top:0;left:50%}
  .orbit b:nth-child(2){top:50%;right:0}
  .orbit b:nth-child(3){bottom:0;left:50%}
  .orbit b:nth-child(4){top:50%;left:0}

  /* speech bubble */
  .main{position:relative;font-size:clamp(22px,5vw,44px);font-weight:900;padding:10px 28px;border-radius:30px;
    background:#fff;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);animation:pulse 1.5s ease-in-out infinite}
  .main::before{content:"";position:absolute;top:-22px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom-color:var(--ink);border-top:0}
  .main::after{content:"";position:absolute;top:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:#fff;border-top:0}
  @keyframes pulse{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.07) rotate(1.5deg)}}

  .cake{font-size:clamp(30px,5vw,50px);animation:cake 1s ease-in-out infinite}
  @keyframes cake{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.18) rotate(8deg)}}

  .hint{font-size:14px;font-weight:700;background:var(--ink);color:var(--yellow);padding:3px 12px;border-radius:12px;transform:rotate(-2deg)}

  #mute{position:fixed;top:14px;right:14px;z-index:10;border:4px solid var(--ink);border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer;background:#fff;box-shadow:4px 4px 0 var(--ink)}
  #tap{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(255,230,0,.92);cursor:pointer;text-align:center;padding:20px}
  #tap div{font-size:clamp(24px,5vw,42px);font-weight:900;animation:pulse 1.2s infinite}
  #tap small{display:block;font-size:15px;font-weight:400;margin-top:10px}

  /* phones: photo on top, videos side by side below */
  @media (max-width:700px){
    .trio{grid-template-columns:1fr 1fr;grid-template-areas:"photo photo" "v1 v2";gap:34px 18px;justify-items:center}
    .pw{width:min(40vw,34vh);height:min(40vw,34vh);margin-top:34px}
    .vid{width:min(38vw,22vh*0.75 + 60px);max-height:26vh}
    .hat{font-size:48px;top:-40px}
    .orbit{inset:-40px}.orbit b{font-size:22px}
  }
</style>
</head>
<body>

<div class="rays"></div>
<canvas id="confetti"></canvas>

<div id="tap"><div>🎉 Tap anywhere to start the party 🎉<small>(music will play)</small></div></div>
<button id="mute" title="Music on/off">🔊</button>

<div class="stage">
  <h1 class="hb" id="title"></h1>

  <div class="trio">
    <div class="vid v1" id="box1">
      <video id="vid1" src="vid1.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <div class="pw">
      <div class="ring"></div>
      <div class="orbit"><b>🎈</b><b>🎁</b><b>🎊</b><b>⭐</b></div>
      <div class="photo"><img src="pht101.jpeg" alt="Birthday girl"></div>
      <div class="hat">🥳</div>
    </div>

    <div class="vid v2" id="box2">
      <video id="vid2" src="vid2.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>
  </div>

  <div class="main">Jaake cake khaalo</div>
  <div class="cake">🎂🎉🍰</div>
  <div class="hint">Tap anywhere for confetti!</div>
</div>

<audio id="bgm" src="birthday.mp3" loop preload="auto"></audio>

<script>
/* ---------- Title letters ---------- */
(function(){
  const text = "Happy Birthday!";
  const colors = ["#ff3b3b","#2f80ff","#ff4fc3","#1fc46a","#ff8a00","#a855f7","#ffffff"];
  const t = document.getElementById("title");
  let i = 0;
  text.split("").forEach(ch=>{
    const s = document.createElement("span");
    if(ch===" "){ s.className="sp"; s.innerHTML="&nbsp;"; }
    else { s.textContent = ch; s.style.color = colors[i % colors.length]; s.style.animationDelay = (i*0.09)+"s"; i++; }
    t.appendChild(s);
  });
})();

/* ---------- Balloons ---------- */
(function(){
  const cols = ["#ff5e7e","#ffffff","#3ddc97","#4cc9f0","#ff9f1c","#b388ff","#ff6ec7"];
  for(let i=0;i<14;i++){
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = (Math.random()*96)+"vw";
    b.style.background = cols[i % cols.length];
    b.style.animationDuration = (10 + Math.random()*10)+"s";
    b.style.animationDelay = (-Math.random()*18)+"s";
    const sc = .7 + Math.random()*.8;
    b.style.width = (56*sc)+"px"; b.style.height = (70*sc)+"px";
    document.body.appendChild(b);
  }
})();

/* ---------- Floating emojis ---------- */
(function(){
  const em = ["🎉","🎊","🎂","🥳","🎁","✨","⭐","🍰","🎈","😂","🤪","🎶","🌟","🧁","🍭","🍌"];
  for(let i=0;i<20;i++){
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = em[i % em.length];
    f.style.left = (Math.random()*94)+"vw";
    f.style.top = (Math.random()*90)+"vh";
    f.style.fontSize = (20 + Math.random()*26)+"px";
    f.style.animationDuration = (3 + Math.random()*4)+"s";
    f.style.animationDelay = (-Math.random()*5)+"s";
    document.body.appendChild(f);
  }
})();

/* ---------- Confetti ---------- */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener("resize", resize);
const palette = ["#ff3b3b","#2f80ff","#ff4fc3","#1fc46a","#ff8a00","#a855f7","#ffffff","#1a1a1a"];
let bits = [];
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,w:6+Math.random()*8,h:4+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:palette[(Math.random()*palette.length)|0],life:140+Math.random()*80});
  }
}
function rain(){
  for(let i=0;i<3;i++){
    bits.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:6+Math.random()*7,h:4+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:palette[(Math.random()*palette.length)|0],life:400});
  }
}
function frame(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b=>b.life>0 && b.y<cv.height+20);
  for(const b of bits){
    b.x+=b.vx; b.y+=b.vy; b.vy+=.12; b.vx*=.99; b.r+=b.vr; b.life--;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  }
  requestAnimationFrame(frame);
}
frame();
setInterval(rain, 250);

addEventListener("pointerdown",e=>burst(e.clientX,e.clientY,70));

/* ---------- Videos (always silent, endless loop) ---------- */
document.querySelectorAll(".vid video").forEach(v=>{
  v.muted = true; v.defaultMuted = true; v.volume = 0; v.loop = true;
  v.play().catch(()=>{});
  v.addEventListener("ended",()=>{ v.currentTime = 0; v.play().catch(()=>{}); });
});
/* retry autoplay on first interaction if the browser blocked it */
addEventListener("pointerdown",()=>{
  document.querySelectorAll(".vid video").forEach(v=>{ if(v.paused) v.play().catch(()=>{}); });
},{once:true});

/* ---------- Music ---------- */
const bgm = document.getElementById("bgm"), tap = document.getElementById("tap"), mute = document.getElementById("mute");
bgm.volume = 0.9;
function startMusic(){
  const p = bgm.play();
  if(p && p.catch){ p.then(()=>{tap.style.display="none"}).catch(()=>{tap.style.display="flex"}); }
}
tap.addEventListener("click",()=>{ bgm.play(); tap.style.display="none"; });
mute.addEventListener("click",e=>{
  e.stopPropagation();
  if(bgm.paused){ bgm.play(); bgm.muted=false; mute.textContent="🔊"; }
  else { bgm.pause(); mute.textContent="🔇"; }
});
window.addEventListener("load",startMusic);
</script>
</body>
</html>
